[build-system]
requires = ["uv_build==0.12.18"]
build-backend = "uv_build"

[project]
name = "enterprise-agenthub"
version = "0.1.0"
description = "Enterprise AgentHub engineering foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.0,<0.144.0",
    "pydantic>=2.14.0,<3.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "uvicorn>=0.54.0,<0.55.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1,<3.0.0",
    "mypy>=2.4.0,<3.0.0",
    "pytest>=9.1.1,<10.0.0",
    "ruff>=0.16.10,<0.17.0",
]

[tool.uv.build-backend]
module-name = "agenthub"
module-root = "backend/src"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["backend/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"
